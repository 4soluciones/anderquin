{% extends 'home.html' %}

{% block title %}Reporte de compras totales | Anderquin ERP{% endblock title %}

{% block body %}

    <div class="erp-page-head roboto-condensed-regular">
        <div>
            <h1 class="erp-page-title"><i class="fas fa-chart-pie mr-2"></i>Reporte de compras totales</h1>
            <p class="erp-page-subtitle">Consolidado de órdenes de compra y facturas por periodo.</p>
        </div>
    </div>

    <div class="container-fluid pt-3">
        <div class="card">

            <div class="card-header">
                <label class="col-form-label col-form-label-lg">Reporte de Compras Totales</label>
            </div>

            <div class="card-body">

                <form class="form-inline" id="search-form" method="POST">
                    {% csrf_token %}
                    <label class="my-1 mr-2" for="id-start-date">Fecha Inicial</label>
                    <input type="date" class="form-control my-1 mr-sm-2"
                           id="id-start-date"
                           name="start-date"
                           value="{{ start_date }}">

                    <label class="my-1 mr-2" for="id-end-date">Fecha final</label>
                    <input type="date" class="form-control my-1 mr-sm-2"
                           id="id-end-date"
                           name="end-date"
                           value="{{ formatdate }}">


                    <label for="id_type_document" class="my-1 ml-2 mr-2">Tipo de Documento:</label>
                    <select id="id_type_document" name="type-document"
                            class="form-control">
                        <option selected value="F">FACTURAS</option>
                        <option value="T">TODO</option>
                    </select>
                    <button type="submit" class="btn btn-blue my-1 ml-2 btn-sales-rounded" id="btn-search">
                        <i class="fas fa-search-dollar mr-1"></i> Buscar
                    </button>
                    <button type="button" class="btn btn-success my-1 ml-2 btn-sales-rounded" id="printReportExcel">
                        <i class="far fa-file-excel mr-1"></i> Exportar a Excel
                    </button>
                </form>

            </div>
        </div>

        <div class="card">

            <div class="card-body table-responsive" id="tbl-purchases">
            </div>

        </div>
    </div>


{% endblock body %}

{% block extrajs %}

    <script type="text/javascript">

        $('#search-form').submit(function (event) {
            event.preventDefault();
            let data = new FormData($('#search-form').get(0));

            $('#btn-search').attr("disabled", "true");

            $.ajax({
                url: '/buys/report_purchases_all/',
                type: "POST",
                data: data,
                cache: false,
                processData: false,
                contentType: false,
                success: function (response, textStatus, xhr) {
                    if (xhr.status === 200) {
                        $('#tbl-purchases').html(response.grid);
                    }
                },
                error: function (jqXhr, textStatus, xhr) {
                    toastr.error('No se pudo generar el reporte.', 'Error');
                },
                complete: function () {
                    $('#btn-search').removeAttr("disabled");
                }
            });
        });

        $(function () {

            $('#printReportExcel').click(function () {
                if ($("#report-payments").length) {
                    $("#report-payments").table2excel({filename: "Compras_totales.xls"});
                } else {
                    toastr.warning('Primero genera el reporte.');
                }
            });

        });
